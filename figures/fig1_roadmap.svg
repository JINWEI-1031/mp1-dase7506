<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <marker id="a-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="a-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="a-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
  <text x="12" y="15" font-size="10" font-weight="700" fill="#2c3e50">Fig. 1  Experiment roadmap: three search lines and one post-hoc gate</text>

  <!-- ============ row 1: shared protocol -> baseline -> equal-target ============ -->
  <rect x="40" y="30" width="180" height="30" rx="5" fill="#f4f7fa" stroke="#34495e" stroke-width="1.1"/>
  <text x="130" y="49" font-size="10.5" text-anchor="middle" fill="#2c3e50">&#167;3  Shared protocol</text>

  <rect x="250" y="30" width="180" height="30" rx="5" fill="#f4f7fa" stroke="#34495e" stroke-width="1.1"/>
  <text x="340" y="49" font-size="10.5" text-anchor="middle" fill="#2c3e50">&#167;4  Baseline anchor 2.1012597</text>

  <rect x="460" y="30" width="180" height="30" rx="5" fill="#f4f7fa" stroke="#34495e" stroke-width="1.1"/>
  <text x="550" y="49" font-size="10.5" text-anchor="middle" fill="#2c3e50">Equal-target control 1.6713833</text>

  <path d="M220,45 H248" stroke="#34495e" stroke-width="1.1" fill="none" marker-end="url(#a-n)"/>
  <path d="M430,45 H458" stroke="#34495e" stroke-width="1.1" fill="none" marker-end="url(#a-n)"/>

  <!-- ============ bus into three parallel lines ============ -->
  <path d="M550,60 V80 H110 M110,80 V88 M340,80 V88 M570,80 V88"
        stroke="#34495e" stroke-width="1.1" fill="none"/>

  <!-- line 1 -->
  <rect x="20" y="88" width="180" height="26" rx="5" fill="#e8f0fe" stroke="#1f6feb" stroke-width="1.1"/>
  <text x="110" y="105" font-size="9.5" font-weight="700" text-anchor="middle" fill="#12407f">Line 1: Recipe &amp; volume</text>
  <text x="28" y="131" font-size="9" fill="#333333">recipe -0.0893 (largest step)</text>
  <text x="28" y="147" font-size="9" fill="#333333">43.5 ep saturation p = 0.7452</text>
  <rect x="20" y="160" width="180" height="36" rx="5" fill="#d6e4ff" stroke="#1f6feb" stroke-width="1.1"/>
  <text x="110" y="182" font-size="9.5" font-weight="700" text-anchor="middle" fill="#12407f">Output: winning recipe</text>

  <!-- line 2 -->
  <rect x="250" y="88" width="180" height="26" rx="5" fill="#eaf5ee" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="340" y="105" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0b4d22">Line 2: Architecture &amp; shape</text>
  <text x="258" y="131" font-size="9" fill="#333333">switches -0.0363</text>
  <text x="258" y="147" font-size="9" fill="#333333">widening (128 to 192) -0.0068</text>
  <rect x="250" y="160" width="180" height="36" rx="5" fill="#d5ecdd" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="340" y="182" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0b4d22">Output: winning geometry</text>

  <!-- line 3 -->
  <rect x="460" y="88" width="180" height="26" rx="5" fill="#fdf3dd" stroke="#b7791f" stroke-width="1.1"/>
  <text x="570" y="105" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7a5310">Line 3: Inference cost</text>
  <text x="468" y="131" font-size="9" fill="#333333">3 arms 5.33 -&gt; 4.87 -&gt; 4.61&#215;</text>
  <text x="468" y="147" font-size="9" fill="#333333">cap read as a MAX, not a mean</text>
  <rect x="460" y="160" width="180" height="36" rx="5" fill="#fbe8bd" stroke="#b7791f" stroke-width="1.1"/>
  <text x="570" y="175" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7a5310">Output: GATE</text>
  <text x="570" y="189" font-size="9" text-anchor="middle" fill="#7a5310">(post-hoc adjudication)</text>

  <!-- ============ collector + adjudication ============ -->
  <path d="M110,196 V210 M340,196 V210 M570,196 V210 M110,210 H570 M340,210 V212"
        stroke="#34495e" stroke-width="1.1" fill="none"/>
  <path d="M340,210 V219" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#a-r)"/>

  <rect x="40" y="222" width="600" height="32" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
  <text x="340" y="242" font-size="10" font-weight="700" text-anchor="middle" fill="#7b241c">Adjudicated by R1: the gate is post-hoc - not &#8220;compute the budget, then pick members&#8221;</text>

  <path d="M340,254 V264" stroke="#34495e" stroke-width="1.1" fill="none" marker-end="url(#a-n)"/>

  <!-- ============ row 4: fusion -> ablation -> shipping ============ -->
  <rect x="40" y="266" width="220" height="36" rx="5" fill="#eaf5ee" stroke="#1a7f37" stroke-width="1.1"/>
  <text x="150" y="282" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0b4d22">&#167;8  Fusion</text>
  <text x="150" y="295" font-size="9" text-anchor="middle" fill="#0b4d22">K=3 probability averaging (-0.0986)</text>

  <rect x="282" y="266" width="110" height="36" rx="5" fill="#f4f7fa" stroke="#34495e" stroke-width="1.1"/>
  <text x="337" y="282" font-size="9.5" font-weight="700" text-anchor="middle" fill="#2c3e50">&#167;9</text>
  <text x="337" y="295" font-size="9" text-anchor="middle" fill="#2c3e50">Ablation</text>

  <rect x="414" y="266" width="226" height="36" rx="5" fill="#fff6dd" stroke="#b7791f" stroke-width="1.1"/>
  <text x="527" y="282" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7a5310">Shipping bundle</text>
  <text x="527" y="295" font-size="9" text-anchor="middle" fill="#7a5310">test BPB 1.4574991 / MAX 4.2910&#215;</text>

  <path d="M260,284 H280" stroke="#34495e" stroke-width="1.1" fill="none" marker-end="url(#a-n)"/>
  <path d="M392,284 H412" stroke="#34495e" stroke-width="1.1" fill="none" marker-end="url(#a-n)"/>

  <text x="340" y="324" font-size="8.5" font-style="italic" text-anchor="middle" fill="#666666">Quality is produced by lines 1-2; deliverability is adjudicated afterwards by line 3 (R1).</text>
</svg>
